# Runs on every push and pull request the two checks CLAUDE.md asks for before every commit:
# the specs validator and the .NET tests (with line coverage of the hand-written code, minimum 80 %).
name: CI

on:
  push:
  pull_request:

jobs:
  specs:
    name: Specs (tools/validate_specs.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate_specs.py

  dotnet:
    name: Generation, validation, signature and sending (dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      # SunatBetaTests are skipped here (they need SUNAT_BETA=1); the CDR of the real run is in specs/examples/sunat-beta/.
      - run: dotnet test --no-build --collect "Code Coverage" --settings coverage.runsettings --results-directory TestResults --logger "trx;LogFileName=tests.trx"
      - name: Coverage gate (80 % of lines of Domain, Application, Infrastructure)
        run: python tools/coverage_gate.py "$(find TestResults -name '*.cobertura.xml' | head -1)" 80
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-coverage
          path: TestResults/
